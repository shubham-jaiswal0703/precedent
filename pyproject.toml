[project]
name = "precedent"
version = "0.1.0"
description = "Playable testimony for law schools: searchable courtroom archives built on VideoDB"
requires-python = ">=3.9"
dependencies = [
    "videodb>=0.5.1",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["precedent*"]
